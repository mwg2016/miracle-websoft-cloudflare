<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B83FF"/>
      <stop offset="100%" stop-color="#5148CC"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0a0a0a"/>

  <!-- M letterform — stroked path, white, with miter join at valley creating a sharp V-notch -->
  <path
    d="M 78,398 L 78,114 L 256,294 L 434,114 L 434,398"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="78"
    stroke-linecap="butt"
    stroke-linejoin="miter"
    stroke-miterlimit="10"
  />

  <!--
    DIAMOND ACCENT
    Sits in the dark negative space at the valley of the M.
    The miter join naturally creates a sharp upward V-notch in the interior;
    the diamond fills that notch with brand accent color, creating a
    hidden gem within the letterform.
    Vertices calculated to sit inside the negative-space triangle.
  -->
  <polygon
    points="256,228  290,266  256,304  222,266"
    fill="url(#accentGrad)"
  />

</svg>
