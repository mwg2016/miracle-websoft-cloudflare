name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export PATH=/home/miraclewebsoft/.nvm/versions/node/v22.22.1/bin:$PATH
            export PM2_HOME=/home/miraclewebsoft/.pm2
            git config --global --add safe.directory /home/miraclewebsoft/htdocs/miraclewebsoft.com
            cd /home/miraclewebsoft/htdocs/miraclewebsoft.com
            git pull origin main
            npm ci
            npm run build
            cp -r public .next/standalone/
            cp -r .next/static .next/standalone/.next/static
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
            echo "Deploy complete"
